name: literexia
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  mongo_dart: ^0.9.1  # MongoDB driver for Dart
  provider: ^6.0.0      # Service locator for dependency injection
  flutter_dotenv: ^5.0.2  # For environment variables
  rive: ^0.12.3 # or latest version
  lottie: ^3.3.1
  google_fonts: ^5.1.0
  confetti: ^0.8.0
  flutter_launcher_icons: ^0.13.1 # or latest version
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.5.3
  just_audio: ^0.9.36  # Audio player package
  audio_session: ^0.1.16  # Audio session management
  video_player: ^2.8.2  # Latest stable version
  # HTTP client for PlayAI TTS API calls
  connectivity_plus: ^5.0.2
  audioplayers: ^5.2.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.0
  http: 1.3.0
  cached_network_image: ^3.3.0  # For caching network images
  crypto: ^3.0.3  # For SHA256 hashing in TTS cache


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/images/creadeLogo_small.png"
  image_path_ios: "assets/images/creadeLogo_small.png"
  adaptive_icon_background: "#354469"
  adaptive_icon_foreground: "assets/images/creadeLogo_small.png"
  # Add padding to make the icon appear smaller
  adaptive_icon_padding: true
  # You can also specify minimum icon size
  min_sdk_android: 21
  # Remove alpha channel for iOS
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/rive/penguin_login.riv
    - assets/rive/animated_login_character.riv
    - assets/animations/5tx253pMzp.json
    - assets/audio/soundwalkcartoon-132207.mp3  # Add your bounce sound effect
    - assets/audio/  # Add audio assets folder
    - assets/audio/assessmentsound.mp3
    - assets/animations/  # Add animations assets folder
    - assets/audio/incorrectanswer.mp3
    - assets/audio/congrats fx.mp3

  fonts:
    - family: Snow Blue
      fonts:
        - asset: assets/fonts/SNOW BLUE.otf
    - family: BubblegumSans
      fonts:
        - asset: assets/fonts/Bubblegum.ttf
    - family: Century Gothic
      fonts:
        - asset: assets/fonts/Century Gothic.ttf
    - family: Open Dyslexic
      fonts:
        - asset: assets/fonts/opendyslexic.glyphs
