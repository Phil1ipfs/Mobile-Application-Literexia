name: literexia
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter
  mongo_dart: ^0.9.1  # MongoDB driver for Dart
  provider: ^6.0.0      # Service locator for dependency injection
  flutter_dotenv: ^5.0.2  # For environment variables
  rive: ^0.12.3 # or latest version
  lottie: ^3.3.1
  google_fonts: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/rive/penguin_login.riv
    - assets/rive/animated_login_character.riv
    - assets/animations/5tx253pMzp.json

  fonts:
    - family: BubblegumSans
      fonts:
        - asset: assets/fonts/Bubblegum.ttf
